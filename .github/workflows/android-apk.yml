#
# Builds the debug APK of the phone-mic fork. It is signed with the checked-in debug.keystore,
# so every build from this repository installs over the previous one.

name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - phone-mic
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'

jobs:
  build-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Check out source code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Accept Android SDK licences
      run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

    - name: Build
      run: ./gradlew --no-daemon --console=plain -Pci assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: kdeconnect-android-phone-mic-debug
        path: build/outputs/apk/debug/kdeconnect-android-debug.apk
        if-no-files-found: error
        retention-days: 30

    - name: Attach to release
      if: github.ref_type == 'tag'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cp build/outputs/apk/debug/kdeconnect-android-debug.apk "kdeconnect-android-phone-mic-${{ github.ref_name }}-debug.apk"
        gh release create "${{ github.ref_name }}" --title "Android ${{ github.ref_name }}" --notes "Debug-signed APK (package org.kde.kdeconnect_tp.debug). Installs next to the Play Store app and updates earlier builds from this repository." "kdeconnect-android-phone-mic-${{ github.ref_name }}-debug.apk" || gh release upload "${{ github.ref_name }}" "kdeconnect-android-phone-mic-${{ github.ref_name }}-debug.apk" --clobber
